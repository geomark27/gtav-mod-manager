# What must pass on every push and pull request to main and develop: Rust format, clippy and
# tests; the UI (typecheck, tests, build); the Windows tests and the Tauri shell; and, on pull
# requests, this branch's devlog entry.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # default-members exclude the Tauri shell (apps/desktop/src-tauri), so no WebKitGTK is
      # needed here; the shell is compiled and linted in the Windows job.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  ui:
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  windows:
    name: Windows (tests, Tauri shell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # tauri::generate_context! reads the frontend from ../dist when the shell is compiled.
      - name: Install and build the UI
        shell: bash
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Runs the #[cfg(windows)] tests: no-replace rename, hard links, version resource,
      # Authenticode.
      - name: Tests
        run: cargo test

      - name: Clippy of the Tauri shell
        run: cargo clippy -p gmm-desktop --all-targets -- -D warnings

  devlog:
    name: Devlog entry
    # Only work branches carry an entry; the promotion PR (develop → main) has none.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same check as `make devlog`: one valid entry per branch, part of the PR diff
      # (.claude/skills/devlog/HOW-IT-WORKS.md §10).
      - name: Verify the entry
        env:
          DEVLOG_BRANCH: ${{ github.head_ref }}
        run: bash .claude/skills/devlog/scripts/verify.sh --base "origin/${{ github.base_ref }}"
