# Tests before a release: runs once on the promotion PR (develop → main), or by hand from the
# Actions tab. Rust (Linux), UI, and the Windows tests + Tauri shell.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # default-members exclude the Tauri shell (apps/desktop/src-tauri), so no WebKitGTK is
      # needed here; the shell is compiled and linted in the Windows job.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  ui:
    name: UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      # tauri build refuses mismatched crate/npm minors: catch it here, not at release time.
      - name: Tauri crates and npm packages aligned
        working-directory: .
        run: bash scripts/check-tauri-versions.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  windows:
    name: Windows (tests, Tauri shell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # tauri::generate_context! reads the frontend from ../dist when the shell is compiled.
      - name: Install and build the UI
        shell: bash
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Runs the #[cfg(windows)] tests: no-replace rename, hard links, version resource,
      # Authenticode.
      - name: Tests
        run: cargo test

      - name: Clippy of the Tauri shell
        run: cargo clippy -p gmm-desktop --all-targets -- -D warnings
