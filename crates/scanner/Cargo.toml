[package]
name = "gmm-scanner"
description = "Installation discovery and structural validation for GTA V Mod Manager: catalogs, OS probes, Steam/Epic/Rockstar detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gmm-domain = { workspace = true }
gmm-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tracing = { workspace = true }
sysinfo = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
gmm-testkit = { workspace = true }
tempfile = { workspace = true }

# Own lints: identical to the workspace lints except that `unsafe` is denied instead of
# forbidden, so that the FFI modules (`src/os/windows_version.rs`, `src/os/windows_authenticode.rs`) can opt in with
# `#![allow(unsafe_code)]`. Every unsafe block there is documented with `// SAFETY:`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
