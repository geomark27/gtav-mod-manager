tracing-appender = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }
dunce = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
gmm-testkit = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
